  <!-- Left leg -->
  <rect x="25" y="20" width="12" height="62" rx="2" fill="currentColor"/>
  <!-- Right leg -->
  <rect x="75" y="20" width="12" height="45" rx="2" fill="currentColor"/>
  <!-- Plugin connector -->
  <rect x="71" y="55" width="20" height="16" rx="3" fill="currentColor"/>
  <rect x="76" y="59" width="3" height="8" rx="1" fill="currentColor"/>
  <rect x="82" y="59" width="3" height="8" rx="1" fill="currentColor"/>
  <!-- Decorative dots -->
  <circle cx="18" cy="14" r="2" fill="currentColor" opacity="0.8"/>
  <circle cx="102" cy="14" r="2" fill="currentColor" opacity="0.8"/>
