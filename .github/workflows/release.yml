name: Publish Gateway Release

# Triggered when a release is published or when manually dispatched.
# Builds all platform binaries + packages with goreleaser and uploads them to
# the GitHub release. Optional publish channels (Homebrew tap, winget PR, AUR)
# activate when their secrets are configured.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Only needed for manual dispatch."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Release tag is required"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.release_tag.outputs.tag }}
        env:
          # Write to a temp path so the tracked CHANGELOG.md is not modified.
          # goreleaser requires a clean working tree; a dirty CHANGELOG.md
          # would abort the release with "git is in a dirty state".
          OUTPUT: ${{ runner.temp }}/CHANGELOG.md
          OUTPUT_STEPS: ${{ runner.temp }}/CHANGELOG_STEPS.md

      - name: Determine publish channels
        id: channels
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        shell: bash
        run: |
          SKIP=""
          [ -z "$HOMEBREW_TAP_TOKEN" ] && SKIP="${SKIP:+$SKIP,}homebrew"
          [ -z "$WINGET_TOKEN" ] && SKIP="${SKIP:+$SKIP,}winget"
          [ -z "$AUR_SSH_KEY" ] && SKIP="${SKIP:+$SKIP,}aur"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          # Skip external publish channels whose secrets are not configured.
          # Goreleaser attempts them with the (empty) token and fails the
          # release otherwise. Builds, archives, checksums, and nfpm packages
          # always run; only the tap/winget/AUR pushes are skipped.
          args: release --clean --skip=${{ steps.channels.outputs.skip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Self-managed installs may run `ferngeist-gateway update`; package
          # channels (brew/winget/apt/AUR) pin versions and do not self-update.
          UPDATE_CHANNEL: self
          # Optional external publish channels — activate by setting the secret.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

      - name: Upload changelog to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          CHANGELOG: ${{ runner.temp }}/CHANGELOG.md
        shell: bash
        run: |
          gh release upload "$TAG" "$CHANGELOG" --clobber

      # Publish the built .deb files as a workflow artifact so the
      # publish-deb-repo job can assemble the apt repo without racing the
      # release upload.
      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error

      # Publish the built .rpm files so publish-rpm-repo can assemble the
      # dnf/yum repo from the same release.
      - name: Upload .rpm artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpms
          path: dist/*.rpm
          if-no-files-found: error

  # Builds a signed apt repository on the gh-pages-deb branch, served via
  # GitHub Pages. The repo is signed with a self-generated PGP key (the
  # private key is stored as APT_GPG_KEY; the public key is committed to the
  # repo). Users add a [signed-by=...] sources line to install/upgrade via apt.
  publish-deb-repo:
    needs: release
    # Run whenever the release job succeeds — both from a published release
    # and from a manual workflow_dispatch (which is how releases are tested).
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The debs are built by the release job's goreleaser step. Upload them
      # as a workflow artifact so this job doesn't race the release upload.
      - name: Download .deb artifacts
        uses: actions/download-artifact@v7
        with:
          name: debs
          path: debs

      # Fetch the existing gh-pages-deb branch (create it if this is the
      # first release). GitHub Pages needs a branch to serve.
      - name: Fetch apt repo branch
        run: |
          if git ls-remote --heads origin gh-pages-deb | grep -q gh-pages-deb; then
            git fetch origin gh-pages-deb
            git worktree add apt-repo gh-pages-deb
          else
            git worktree add -b gh-pages-deb apt-repo
          fi

      # Import the signing key (self-generated, stored as a secret). The
      # public key is committed so users can pin it via signed-by=.
      - name: Import signing key
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          if [ -z "$APT_GPG_KEY" ]; then
            echo "APT_GPG_KEY not set — repo will be unsigned. Set it to sign."
            exit 0
          fi
          echo "$APT_GPG_KEY" | gpg --batch --import

      # Assemble the pool/ tree under deb/ so the repo is served at
      # https://arafatamim.github.io/ferngeist-acp-gateway/deb/ (matching the
      # sources line in docs/install.md).
      - name: Assemble apt repo
        run: |
          cd apt-repo
          mkdir -p deb
          # One-liner setup script for end users (keyring + sources + install).
          cp "$GITHUB_WORKSPACE/packaging/apt-setup.sh" deb/setup.sh
          chmod +x deb/setup.sh
          for deb in ../debs/*.deb; do
            arch="$(dpkg-deb -f "$deb" Architecture)"
            mkdir -p "deb/dists/stable/main/binary-$arch"
            mkdir -p "deb/pool/main/f/ferngeist-gateway"
            cp "$deb" "deb/pool/main/f/ferngeist-gateway/"
          done

      # Generate the Packages/Release metadata + sign it (if key present).
      - name: Generate + sign apt metadata
        run: |
          cd apt-repo/deb
          for dir in dists/stable/main/binary-*; do
            arch="${dir##*-}"
            # Scan the pool (deb/pool) and emit relative pool/... paths into
            # Packages so apt can resolve the .deb. Run from deb/ so the scan
            # root is a direct child — running from binary-<arch> would leak
            # ../../../../ into the Filename. Path="pool" + recursion-relative
            # "main/f/..." = "pool/main/f/...".
            apt-ftparchive packages -o APT::FTPArchive::Packages::Path="pool" pool > "$dir/Packages"
            gzip -kf "$dir/Packages"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Ferngeist \
            -o APT::FTPArchive::Release::Label=Ferngeist \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release
          if gpg --list-secret-keys 2>/dev/null | grep -q sec; then
            # InRelease must be CLEARSIGNED (apt validates it with gpgv).
            # A detached armored signature (-absb) is only valid as Release.gpg.
            # --pinentry-mode loopback: never prompt for a passphrase on a
            # headless runner (works for passphrase-less signing keys).
            gpg --batch --yes --pinentry-mode loopback --passphrase '' --clearsign -o dists/stable/InRelease dists/stable/Release
            gpg --batch --yes --pinentry-mode loopback --passphrase '' -absb -o dists/stable/Release.gpg dists/stable/Release
          fi
          # Commit the public key so users can pin it via signed-by=. Export
          # the key that signed the Release (the primary [SC] key) so the
          # pinned key always matches the InRelease signature.
          if gpg --list-secret-keys 2>/dev/null | grep -q sec; then
            SIGNER="$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '$1=="sec" {print $5; exit}')"
            if [ -n "$SIGNER" ]; then
              gpg --export --armor "$SIGNER" > key.asc
            else
              gpg --export --armor > key.asc
            fi
          else
            echo "No key to export — repo unsigned."
            rm -f key.asc
          fi

      - name: Commit + push apt repo
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to apt repo"
            exit 0
          fi
          git commit -m "apt: publish release packages"
          git push origin HEAD:gh-pages-deb

  # Builds a signed dnf/yum repository on the SAME gh-pages-deb branch (Pages
  # serves it; rpm/ lives next to deb/). Serialized after publish-deb-repo so
  # the two jobs never race the worktree push. Packages are signed with the
  # same key as the apt repo (APT_GPG_KEY) — rpm verifies package headers via
  # gpgcheck, and repomd.xml.asc covers repo_gpgcheck.
  publish-rpm-repo:
    # Serialized after publish-deb-repo (same branch, no push race); also
    # depends on release so needs.release.result is valid.
    needs:
      - release
      - publish-deb-repo
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # createrepo_c and rpm/rpmsign are needed to assemble and sign the repo.
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y createrepo-c rpm

      - name: Download .rpm artifacts
        uses: actions/download-artifact@v7
        with:
          name: rpms
          path: rpms

      - name: Fetch repo branch
        run: |
          if git ls-remote --heads origin gh-pages-deb | grep -q gh-pages-deb; then
            git fetch origin gh-pages-deb
            git worktree add rpm-repo gh-pages-deb
          else
            git worktree add -b gh-pages-deb rpm-repo
          fi

      # Import the signing key (same key as the apt repo).
      - name: Import signing key
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          if [ -z "$APT_GPG_KEY" ]; then
            echo "APT_GPG_KEY not set — repo will be unsigned."
            exit 0
          fi
          echo "$APT_GPG_KEY" | gpg --batch --import

      # Sign each rpm's header (gpgcheck=1) and lay out x86_64/ + aarch64/.
      - name: Sign + assemble rpm repo
        run: |
          cd rpm-repo
          mkdir -p rpm
          # One-liner setup script for end users (key import + repo file + install).
          cp "$GITHUB_WORKSPACE/packaging/rpm-setup.sh" rpm/setup.sh
          chmod +x rpm/setup.sh
          if gpg --list-secret-keys 2>/dev/null | grep -q sec; then
            SIGNER="$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '$1=="sec" {print $5; exit}')"
            for rpm in ../rpms/*.rpm; do
              echo "signing $rpm"
              # _gpg_name is the portable rpmsign key selector (fingerprint).
              rpmsign --addsign --define "_gpg_name $SIGNER" "$rpm" >/dev/null 2>&1 || echo "WARN: rpmsign failed for $rpm"
            done
          else
            echo "No key — skipping package signatures."
          fi
          for rpm in ../rpms/*.rpm; do
            base="$(basename "$rpm")"
            case "$base" in
              *amd64*) arch=x86_64 ;;
              *arm64*) arch=aarch64 ;;
              *) echo "WARN: unknown arch for $base"; continue ;;
            esac
            mkdir -p "rpm/$arch"
            cp "$rpm" "rpm/$arch/"
          done

      # Generate repodata/ (createrepo_c) + detached repomd.xml signature.
      - name: Generate + sign rpm metadata
        run: |
          cd rpm-repo
          for arch in x86_64 aarch64; do
            if [ -d "rpm/$arch" ] && ls "rpm/$arch"/*.rpm >/dev/null 2>&1; then
              createrepo_c "rpm/$arch"
            fi
          done
          if gpg --list-secret-keys 2>/dev/null | grep -q sec; then
            for arch in x86_64 aarch64; do
              if [ -f "rpm/$arch/repodata/repomd.xml" ]; then
                gpg --batch --yes --pinentry-mode loopback --passphrase '' -absb -o "rpm/$arch/repodata/repomd.xml.asc" "rpm/$arch/repodata/repomd.xml"
              fi
            done
          fi
          # Public key for gpgcheck (import with: rpm --import key.asc)
          if gpg --list-secret-keys 2>/dev/null | grep -q sec; then
            SIGNER="$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '$1=="sec" {print $5; exit}')"
            gpg --export --armor "$SIGNER" > rpm/key.asc
          else
            rm -f rpm/key.asc
          fi

      - name: Commit + push rpm repo
        run: |
          cd rpm-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to rpm repo"
            exit 0
          fi
          git commit -m "rpm: publish release packages"
          git push origin HEAD:gh-pages-deb
