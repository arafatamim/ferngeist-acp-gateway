name: Publish Gateway Release

# Triggered when a release is published or when manually dispatched.
# Builds all platform binaries + packages with goreleaser and uploads them to
# the GitHub release. Optional publish channels (Homebrew tap, winget PR, AUR)
# activate when their secrets are configured.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Only needed for manual dispatch."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Release tag is required"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.release_tag.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Self-managed installs may run `ferngeist-gateway update`; package
          # channels (brew/winget/apt/AUR) pin versions and do not self-update.
          UPDATE_CHANNEL: self
          # Optional external publish channels — activate by setting the secret.
          # Without them goreleaser still builds every artifact; only the
          # tap/winget/AUR pushes are skipped.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

      - name: Upload changelog to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$TAG" CHANGELOG.md --clobber
