name: Publish Gateway Release

# Triggered when a release is published or when manually dispatched.
# Builds all platform binaries + packages with goreleaser and uploads them to
# the GitHub release. Optional publish channels (Homebrew tap, winget PR)
# activate when their secrets are configured.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Only needed for manual dispatch."
        required: true
        type: string
      dry_run:
        description: "Snapshot build published to the gh-pages-dryrun branch only (no release assets, formula or live repos touched)."
        type: boolean
        default: false

permissions:
  contents: write

# The repo jobs force-push gh-pages, so two overlapping runs would silently
# drop each other's packages; queue them instead.
concurrency:
  group: publish-gateway-release
  cancel-in-progress: false

env:
  # Package versions kept per arch in the apt/rpm/pacman repos. GitHub Pages
  # rejects sites over 1 GB; older versions stay on the Releases page.
  KEEP_VERSIONS: 3
  # Branch the repo jobs publish to. A dry run seeds gh-pages-dryrun from
  # the live gh-pages so pruning and the repo dbs run against real state.
  PAGES_BRANCH: ${{ inputs.dry_run && 'gh-pages-dryrun' || 'gh-pages' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Release tag is required"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.release_tag.outputs.tag }}
        env:
          # Write to a temp path so the tracked CHANGELOG.md is not modified.
          # goreleaser requires a clean working tree; a dirty CHANGELOG.md
          # would abort the release with "git is in a dirty state".
          OUTPUT: ${{ runner.temp }}/CHANGELOG.md
          OUTPUT_STEPS: ${{ runner.temp }}/CHANGELOG_STEPS.md

      - name: Determine publish channels
        id: channels
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        shell: bash
        run: |
          SKIP=""
          [ -z "$WINGET_TOKEN" ] && SKIP="${SKIP:+$SKIP,}winget"
          [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ] && SKIP="${SKIP:+$SKIP,}homebrew"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          # Skip external publish channels whose secrets are not configured.
          # Goreleaser attempts them with the (empty) token and fails the
          # release otherwise. Builds, archives, checksums, and nfpm packages
          # always run; the Homebrew formula push to arafatamim/homebrew-tap
          # and the winget PR are skipped when their secrets are unset.
          args: release --clean --skip=${{ steps.channels.outputs.skip }} ${{ inputs.dry_run && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Self-managed installs may run `ferngeist-gateway update`; package
          # channels (brew/winget/apt/pacman) pin versions and do not self-update.
          UPDATE_CHANNEL: self
          # Optional external publish channels — activate by setting the secret.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Upload changelog to release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          CHANGELOG: ${{ runner.temp }}/CHANGELOG.md
        shell: bash
        run: |
          gh release upload "$TAG" "$CHANGELOG" --clobber

      # Publish the built .deb files as a workflow artifact so the
      # publish-deb-repo job can assemble the apt repo without racing the
      # release upload.
      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error

      # Publish the built .rpm files so publish-rpm-repo can assemble the
      # dnf/yum repo from the same release.
      - name: Upload .rpm artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpms
          path: dist/*.rpm
          if-no-files-found: error

      # Publish the built .pkg.tar.zst files so publish-arch-repo can assemble
      # the pacman repo from the same release.
      - name: Upload .pkg.tar.zst artifacts
        uses: actions/upload-artifact@v7
        with:
          name: archpkgs
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  # Builds a signed apt repository on the gh-pages branch, served via
  # GitHub Pages. The repo is signed with a self-generated PGP key (the
  # private key is stored as APT_GPG_KEY; the public key is committed to the
  # repo). Users add a [signed-by=...] sources line to install/upgrade via apt.
  publish-deb-repo:
    needs: release
    # Run whenever the release job succeeds — both from a published release
    # and from a manual workflow_dispatch (which is how releases are tested).
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The debs are built by the release job's goreleaser step. Upload them
      # as a workflow artifact so this job doesn't race the release upload.
      - name: Download .deb artifacts
        uses: actions/download-artifact@v8
        with:
          name: debs
          path: debs

      # Fetch the existing gh-pages branch (create it if this is the
      # first release). GitHub Pages needs a branch to serve.
      - name: Fetch apt repo branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add -B "$PAGES_BRANCH" apt-repo FETCH_HEAD
          else
            git worktree add -b "$PAGES_BRANCH" apt-repo
          fi

      # Import the signing key (self-generated, stored as a secret). The
      # public key is committed so users can pin it via signed-by=.
      - name: Import signing key
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          if [ -z "$APT_GPG_KEY" ]; then
            echo "APT_GPG_KEY not set — repo will be unsigned. Set it to sign."
            exit 0
          fi
          echo "$APT_GPG_KEY" | gpg --batch --import

      # Assemble the pool/ tree under deb/ so the repo is served at
      # https://arafatamim.github.io/ferngeist-acp-gateway/deb/ (matching the
      # sources line in docs/install.md).
      - name: Assemble apt repo
        run: |
          cd apt-repo
          mkdir -p deb
          for deb in ../debs/*.deb; do
            arch="$(dpkg-deb -f "$deb" Architecture)"
            mkdir -p "deb/dists/stable/main/binary-$arch"
            mkdir -p "deb/pool/main/f/ferngeist-gateway"
            cp "$deb" "deb/pool/main/f/ferngeist-gateway/"
          done
          # sort -V: 0.10.0 is newer than 0.9.3 (a plain sort gets it wrong).
          for arch in amd64 arm64; do
            ls deb/pool/main/f/ferngeist-gateway/*_"$arch".deb 2>/dev/null | sort -V | head -n -"$KEEP_VERSIONS" | xargs -r rm -f --
          done

      # The universal installer lives at the Pages root so the one-liner
      # curl -fsSL https://arafatamim.github.io/ferngeist-acp-gateway/install.sh | sh
      # works on macOS + Linux (tries apt/pacman/rpm/brew, falls back to a
      # user-level binary install). Deployed by the first repo job so the
      # later jobs never race it.
      - name: Deploy universal installer
        run: |
          cd apt-repo
          cp "$GITHUB_WORKSPACE/packaging/install.sh" install.sh
          chmod +x install.sh

      # The Windows PowerShell installer lives at the Pages root so the
      # one-liner irm https://arafatamim.github.io/ferngeist-acp-gateway/install.ps1 | iex
      # works on Windows (downloads the release zip, verifies the checksum,
      # installs the per-user scheduled task). Deployed by the first repo job
      # so the later jobs never race it.
      - name: Deploy Windows installer
        run: |
          cd apt-repo
          cp "$GITHUB_WORKSPACE/packaging/install.ps1" install.ps1
          chmod +x install.ps1

      # Generate the Packages/Release metadata + sign it (if key present).
      - name: Generate + sign apt metadata
        run: |
          cd apt-repo/deb
          for dir in dists/stable/main/binary-*; do
            arch="${dir##*-}"
            # Scan the pool (deb/pool) and emit relative pool/... paths into
            # Packages so apt can resolve the .deb. Run from deb/ so the scan
            # root is a direct child — running from binary-<arch> would leak
            # ../../../../ into the Filename. Path="pool" + recursion-relative
            # "main/f/..." = "pool/main/f/...".
            apt-ftparchive packages -o APT::FTPArchive::Packages::Path="pool" pool > "$dir/Packages"
            gzip -kf "$dir/Packages"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Ferngeist \
            -o APT::FTPArchive::Release::Label=Ferngeist \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release
          if gpg --list-secret-keys 2>/dev/null | grep -q sec; then
            # InRelease must be CLEARSIGNED (apt validates it with gpgv).
            # A detached armored signature (-absb) is only valid as Release.gpg.
            # --pinentry-mode loopback: never prompt for a passphrase on a
            # headless runner (works for passphrase-less signing keys).
            gpg --batch --yes --pinentry-mode loopback --passphrase '' --clearsign -o dists/stable/InRelease dists/stable/Release
            gpg --batch --yes --pinentry-mode loopback --passphrase '' -absb -o dists/stable/Release.gpg dists/stable/Release
          fi
          # Commit the public key so users can pin it via signed-by=. Export
          # the key that signed the Release (the primary [SC] key) so the
          # pinned key always matches the InRelease signature.
          if gpg --list-secret-keys 2>/dev/null | grep -q sec; then
            SIGNER="$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '$1=="sec" {print $5; exit}')"
            if [ -n "$SIGNER" ]; then
              gpg --export --armor "$SIGNER" > key.asc
            else
              gpg --export --armor > key.asc
            fi
          else
            echo "No key to export — repo unsigned."
            rm -f key.asc
          fi

      - name: Commit + push apt repo
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to apt repo"
            exit 0
          fi
          # Publish as one parentless commit: history would otherwise keep
          # every pruned package forever and grow the repo without bound.
          git push --force origin "$(git commit-tree "$(git write-tree)" -m "apt: publish release packages")":"refs/heads/$PAGES_BRANCH"

  # Builds a signed dnf/yum repository on the SAME gh-pages branch (Pages
  # serves it; rpm/ lives next to deb/). Serialized after publish-deb-repo so
  # the two jobs never race the worktree push. Packages are signed with the
  # same key as the apt repo (APT_GPG_KEY) — rpm verifies package headers via
  # gpgcheck, and repomd.xml.asc covers repo_gpgcheck.
  publish-rpm-repo:
    # Serialized after publish-deb-repo (same branch, no push race); also
    # depends on release so needs.release.result is valid.
    needs:
      - release
      - publish-deb-repo
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # createrepo_c and rpm/rpmsign are needed to assemble and sign the repo.
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y createrepo-c rpm

      - name: Download .rpm artifacts
        uses: actions/download-artifact@v8
        with:
          name: rpms
          path: rpms

      - name: Fetch repo branch
        run: |
          if git ls-remote --exit-code --heads origin "$PAGES_BRANCH" >/dev/null; then
            git fetch origin "$PAGES_BRANCH"
            git worktree add -B "$PAGES_BRANCH" rpm-repo FETCH_HEAD
          else
            git worktree add -b "$PAGES_BRANCH" rpm-repo
          fi

      # Import the signing key (same key as the apt repo).
      - name: Import signing key
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          if [ -z "$APT_GPG_KEY" ]; then
            echo "APT_GPG_KEY not set — repo will be unsigned."
            exit 0
          fi
          echo "$APT_GPG_KEY" | gpg --batch --import

      # Sign each rpm's header (gpgcheck=1) and lay out x86_64/ + aarch64/.
      - name: Sign + assemble rpm repo
        run: |
          cd rpm-repo
          mkdir -p rpm
          if gpg --list-secret-keys 2>/dev/null | grep -q sec; then
            SIGNER="$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '$1=="sec" {print $5; exit}')"
            for rpm in ../rpms/*.rpm; do
              echo "signing $rpm"
              # _gpg_name is the portable rpmsign key selector (fingerprint).
              # Fail the job: an unsigned rpm is rejected by gpgcheck=1 clients.
              rpmsign --addsign --define "_gpg_name $SIGNER" "$rpm"
            done
          else
            echo "No key — skipping package signatures."
          fi
          for rpm in ../rpms/*.rpm; do
            base="$(basename "$rpm")"
            case "$base" in
              *amd64*) arch=x86_64 ;;
              *arm64*) arch=aarch64 ;;
              *) echo "WARN: unknown arch for $base"; continue ;;
            esac
            mkdir -p "rpm/$arch"
            cp "$rpm" "rpm/$arch/"
          done
          for arch in x86_64 aarch64; do
            ls "rpm/$arch"/*.rpm 2>/dev/null | sort -V | head -n -"$KEEP_VERSIONS" | xargs -r rm -f --
          done

      # Generate repodata/ (createrepo_c) + detached repomd.xml signature.
      - name: Generate + sign rpm metadata
        run: |
          cd rpm-repo
          for arch in x86_64 aarch64; do
            if [ -d "rpm/$arch" ] && ls "rpm/$arch"/*.rpm >/dev/null 2>&1; then
              createrepo_c "rpm/$arch"
            fi
          done
          if gpg --list-secret-keys 2>/dev/null | grep -q sec; then
            for arch in x86_64 aarch64; do
              if [ -f "rpm/$arch/repodata/repomd.xml" ]; then
                gpg --batch --yes --pinentry-mode loopback --passphrase '' -absb -o "rpm/$arch/repodata/repomd.xml.asc" "rpm/$arch/repodata/repomd.xml"
              fi
            done
          fi
          # Public key for gpgcheck (import with: rpm --import key.asc)
          if gpg --list-secret-keys 2>/dev/null | grep -q sec; then
            SIGNER="$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '$1=="sec" {print $5; exit}')"
            gpg --export --armor "$SIGNER" > rpm/key.asc
          else
            rm -f rpm/key.asc
          fi

      - name: Commit + push rpm repo
        run: |
          cd rpm-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to rpm repo"
            exit 0
          fi
          # Publish as one parentless commit: history would otherwise keep
          # every pruned package forever and grow the repo without bound.
          git push --force origin "$(git commit-tree "$(git write-tree)" -m "rpm: publish release packages")":"refs/heads/$PAGES_BRANCH"

  # Builds a signed pacman repository on the SAME gh-pages branch (arch/
  # next to deb/ and rpm/). repo-add ships with pacman, which only exists on
  # Arch — hence the archlinux container. Serialized after publish-rpm-repo
  # so the two jobs never race the worktree push. Packages + repo db are
  # signed with the same key as apt/rpm (APT_GPG_KEY).
  publish-arch-repo:
    needs:
      - release
      - publish-rpm-repo
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      # git (checkout/commit) and gnupg (signing) are not in the archlinux
      # base image; repo-add/pacman already are.
      - name: Install tooling
        run: pacman -Syu --noconfirm --needed git gnupg

      # The container runs as root but the checkout dir is owned by the
      # runner's UID; without this git refuses to touch it (dubious
      # ownership). Safe because every path is this job's own worktree.
      - name: Mark checkout dir safe
        run: git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download .pkg.tar.zst artifacts
        uses: actions/download-artifact@v8
        with:
          name: archpkgs
          path: archpkgs

      - name: Fetch repo branch
        run: |
          if git ls-remote --exit-code --heads origin "$PAGES_BRANCH" >/dev/null; then
            git fetch origin "$PAGES_BRANCH"
            git worktree add -B "$PAGES_BRANCH" arch-repo FETCH_HEAD
          else
            git worktree add -b "$PAGES_BRANCH" arch-repo
          fi

      # Import the signing key (same key as the apt repo).
      - name: Import signing key
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          if [ -z "$APT_GPG_KEY" ]; then
            echo "APT_GPG_KEY not set — repo will be unsigned."
            exit 0
          fi
          echo "$APT_GPG_KEY" | gpg --batch --import

      - name: Assemble + sign arch repo
        run: |
          cd arch-repo
          mkdir -p arch
          # Generated artifacts must stay byte-identical across checkouts
          # (same CRLF-corruption class that broke the rpm repomd signature).
          grep -q '^arch/\*\* -text' .gitattributes 2>/dev/null || echo 'arch/** -text' >> .gitattributes
          for pkg in ../archpkgs/*.pkg.tar.zst; do
            base="$(basename "$pkg")"
            case "$base" in
              *_linux_amd64.pkg.tar.zst) arch=x86_64 ;;
              *_linux_arm64.pkg.tar.zst) arch=aarch64 ;;
              *) echo "WARN: unknown arch for $base"; continue ;;
            esac
            mkdir -p "arch/$arch"
            cp "$pkg" "arch/$arch/"
          done
          # The db only ever lists the newest version, so pruned files are
          # never referenced. Drop each package's .sig with it.
          for arch in x86_64 aarch64; do
            ls "arch/$arch"/*.pkg.tar.zst 2>/dev/null | sort -V | head -n -"$KEEP_VERSIONS" | while read -r pkg; do
              rm -f "$pkg" "$pkg.sig"
            done
          done
          if gpg --list-secret-keys 2>/dev/null | grep -q sec; then
            SIGNER="$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '$1=="sec" {print $5; exit}')"
            for arch in x86_64 aarch64; do
              if ls "arch/$arch"/*.pkg.tar.zst >/dev/null 2>&1; then
                # Sign each package (pacman SigLevel=Required checks these).
                # Binary, not armored: repo-add embeds it in the db, and
                # pacman reports "signature format error" for an armored one.
                for pkg in "arch/$arch"/*.pkg.tar.zst; do
                  echo "signing $pkg"
                  gpg --batch --yes --pinentry-mode loopback --passphrase '' --detach-sign -o "$pkg.sig" "$pkg"
                done
                # Build the repo db. repo-add creates *.db.tar.gz + a *.db
                # pointer. On a fresh checkout (no prior .db) that pointer is
                # a regular file, but once one exists it becomes a symlink;
                # GitHub Pages does not reliably follow symlinks, so replace a
                # symlink with the real file. Same for .files. || true: the
                # [ -L ] test is false on a fresh repo and must not trip -e.
                # -p: the glob is lexical (0.10.0 < 0.9.3), so without it an
                # older package added later would downgrade the db entry.
                (cd "arch/$arch" && repo-add -p ferngeist-gateway.db.tar.gz *.pkg.tar.zst)
                { [ -L "arch/$arch/ferngeist-gateway.db" ] && cp "arch/$arch/ferngeist-gateway.db.tar.gz" "arch/$arch/ferngeist-gateway.db"; } || true
                { [ -L "arch/$arch/ferngeist-gateway.files" ] && cp "arch/$arch/ferngeist-gateway.files.tar.gz" "arch/$arch/ferngeist-gateway.files"; } || true
                # Sign the db (pacman verifies <repo>.db.tar.gz.sig).
                gpg --batch --yes --pinentry-mode loopback --passphrase '' --detach-sign -o "arch/$arch/ferngeist-gateway.db.tar.gz.sig" "arch/$arch/ferngeist-gateway.db.tar.gz"
                # pacman fetches <repo>.db.sig; only a legacy committed symlink
                # provides it today, so a fresh gh-pages would break SigLevel.
                ln -sf ferngeist-gateway.db.tar.gz.sig "arch/$arch/ferngeist-gateway.db.sig"
              fi
            done
            # Public key for pacman-key --add (same as deb/rpm).
            gpg --export --armor "$SIGNER" > arch/key.asc
          else
            echo "No key — skipping signatures."
            rm -f arch/key.asc
          fi

      - name: Commit + push arch repo
        run: |
          cd arch-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to arch repo"
            exit 0
          fi
          # Publish as one parentless commit: history would otherwise keep
          # every pruned package forever and grow the repo without bound.
          git push --force origin "$(git commit-tree "$(git write-tree)" -m "arch: publish release packages")":"refs/heads/$PAGES_BRANCH"

  # Installs from the branch just published, before Pages serves it (and
  # for a dry run, which Pages never serves): repo metadata, signatures,
  # pruning and the install.sh package channels on each distro.
  verify-repos:
    needs: publish-arch-repo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "fedora:latest", "archlinux:latest"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Serve the published repo branch
        run: |
          git fetch origin "$PAGES_BRANCH"
          git worktree add --detach site FETCH_HEAD
          python3 -m http.server -d site 8000 >/dev/null 2>&1 &

      - name: Install via install.sh from the served repo
        run: |
          docker run --rm --network host -v "$PWD:/src" \
            -e FERNGEIST_REPO_BASE=http://localhost:8000 \
            "${{ matrix.image }}" sh /src/packaging/ci/test-linux.sh
