version: 2

project_name: ferngeist-gateway

before:
  hooks:
    - go mod tidy

builds:
  - id: gateway
    main: ./cmd/ferngeist
    binary: ferngeist-gateway
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.buildCommit={{.Commit}}
      - -X main.buildTime={{.Date}}
      - -X main.updateChannel={{.Env.UPDATE_CHANNEL}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: '{{ .CommitTimestamp }}'

  # Package builds (deb/rpm) carry updateChannel=apt in the binary itself so
  # `ferngeist-gateway update` refuses to self-update at the binary level —
  # no reliance on the service env file. Only Linux (packages are linux-only).
  - id: gateway-pkg
    main: ./cmd/ferngeist
    binary: ferngeist-gateway
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.buildCommit={{.Commit}}
      - -X main.buildTime={{.Date}}
      - -X main.updateChannel=apt
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'

  # Arch Linux package build carries updateChannel=pacman so the binary
  # refuses self-update with "installed via pacman" (distinct from deb/rpm's
  # "apt" so the message names the right package manager).
  - id: gateway-arch
    main: ./cmd/ferngeist
    binary: ferngeist-gateway
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.buildCommit={{.Commit}}
      - -X main.buildTime={{.Date}}
      - -X main.updateChannel=pacman
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'

  # Homebrew/Linuxbrew formula build carries updateChannel=brew so
  # brew-installed binaries refuse self-update with "installed via brew".
  # Covers darwin + linux (Linuxbrew). Selected by the brew archive set; not
  # part of the default archives or any nfpm package.
  - id: gateway-brew
    main: ./cmd/ferngeist
    binary: ferngeist-gateway
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.buildCommit={{.Commit}}
      - -X main.buildTime={{.Date}}
      - -X main.updateChannel=brew
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'

  # Android (Termux) build. MUST use cgo + the NDK clang: Go's pure-Go DNS
  # resolver (CGO_ENABLED=0) reads /etc/resolv.conf, which Android/Termux
  # doesn't have, so it falls back to ::1:53 and all DNS fails. cgo uses
  # bionic's system resolver (Android's real DNS). The runner has the NDK
  # preinstalled (ANDROID_NDK_HOME). arm64 only — android/arm and android/amd64
  # also force cgo but target obsolete/rare devices.
  - id: gateway-android
    main: ./cmd/ferngeist
    binary: ferngeist-gateway
    env:
      - CGO_ENABLED=1
      - CC=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.buildCommit={{.Commit}}
      - -X main.buildTime={{.Date}}
      - -X main.updateChannel={{.Env.UPDATE_CHANNEL}}
    goos:
      - android
    goarch:
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    # Only the self-update-capable build goes into archives; gateway-pkg and
    # gateway-arch are used solely for nfpm packages. gateway-android is the
    # Termux artifact (cgo+NDK build, android_arm64).
    ids:
      - gateway
      - gateway-android
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - LICENSE

  # Homebrew/Linuxbrew archive set: same per-OS/arch layout as default, but
  # built from gateway-brew (updateChannel=brew) so brew-installed binaries
  # refuse self-update. The _brew suffix keeps the 4 filenames distinct from
  # the default set (the brew pipe requires exactly one archive per OS/arch).
  # Selected by brews.ids below; not listed in the manual-download docs.
  - id: brew
    ids:
      - gateway-brew
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_brew'
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'SHA256SUMS'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# Homebrew formula (macOS + Linuxbrew). Deliberately uses the deprecated
# `brews` pipe: `homebrew_casks` generates casks, which are macOS-centric and
# only partially supported on Linuxbrew; a formula is the correct artifact
# for a CLI binary on both. The formula lives in its own tap repo
# (arafatamim/homebrew-tap): brew tap clones every branch, and this repo's
# gh-pages holds the apt/rpm/pacman packages (~1 GB).
brews:
  - name: ferngeist-gateway
    homepage: 'https://github.com/arafatamim/ferngeist-acp-gateway'
    description: 'Self-hosted backend service for ACP-compatible agents'
    license: MIT
    repository:
      owner: arafatamim
      name: homebrew-tap
      branch: main
      # Pushed over SSH with a write deploy key on the tap repo; GITHUB_TOKEN
      # cannot write to another repository.
      git:
        url: 'git@github.com:arafatamim/homebrew-tap.git'
        private_key: '{{ envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}'
    directory: Formula
    commit_author:
      name: Ferngeist Gateway
      email: 31634638+arafatamim@users.noreply.github.com
    ids:
      - brew
    # No post_install: brew sandboxes it (macOS: temporary HOME; Linux:
    # Landlock, no session bus), so the service can't be registered there.
    # install.sh registers it (the caveat covers manual installs); the daemon
    # restarts itself when brew upgrade moves the opt link it runs from.
    caveats: |
      Start the daemon with:
        ferngeist-gateway daemon install --keep-settings --lan
      It then restarts on the new version after each brew upgrade. If you
      upgraded from 1.0.0 or earlier, run the command above once more.

# .deb (Ubuntu/Debian) and .rpm (Fedora/RHEL) packages. postinstall runs
# `daemon install` so a per-user systemd user service is created on first
# install. The binary is added automatically by goreleaser (bindir).
nfpms:
  - id: packages
    package_name: ferngeist-gateway
    # Package only the apt-channel binary (self-update refused at binary level).
    ids:
      - gateway-pkg
    file_name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}'
    vendor: Ferngeist
    homepage: 'https://github.com/arafatamim/ferngeist-acp-gateway'
    description: 'Self-hosted backend service for ACP-compatible agents'
    maintainer: 'Ferngeist Maintainers <maintainers@ferngeist.local>'
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./README.md
        dst: /usr/share/doc/ferngeist-gateway/README.md
    scripts:
      postinstall: ./packaging/postinstall.sh
      preremove: ./packaging/preremove.sh

  # Arch Linux binary package (ferngeist-gateway-<ver>-1-<arch>.pkg.tar.zst).
  # Built from the pacman-channel binary; postinstall registers the daemon
  # exactly like deb/rpm. The repo database is assembled by the
  # publish-arch-repo workflow job (repo-add lives in pacman, not nfpm).
  - id: arch
    package_name: ferngeist-gateway
    ids:
      - gateway-arch
    vendor: Ferngeist
    homepage: 'https://github.com/arafatamim/ferngeist-acp-gateway'
    description: 'Self-hosted backend service for ACP-compatible agents'
    maintainer: 'Ferngeist Maintainers <maintainers@ferngeist.local>'
    license: MIT
    formats:
      - archlinux
    bindir: /usr/bin
    contents:
      - src: ./README.md
        dst: /usr/share/doc/ferngeist-gateway/README.md
    scripts:
      postinstall: ./packaging/postinstall.sh
      preremove: ./packaging/preremove.sh
    # pacman runs post_upgrade (not post_install) on upgrades; without it the
    # daemon keeps running the old binary copied by the first `daemon install`.
    archlinux:
      scripts:
        postupgrade: ./packaging/postinstall.sh

release:
  github:
    owner: arafatamim
    name: ferngeist-acp-gateway
  # Re-running a release (e.g. after a tag repoint) must overwrite the
  # existing assets — GitHub returns 422 on duplicate uploads, and goreleaser
  # only deletes + re-uploads when this is set.
  replace_existing_artifacts: true

# winget manifest for microsoft/winget-pkgs. Generated in dist/ by the build
# job (--skip=publish); the publish job opens the PR with WINGET_TOKEN.
winget:
  - name: Ferngeist.Gateway
    publisher: Ferngeist
    homepage: 'https://github.com/arafatamim/ferngeist-acp-gateway'
    short_description: 'Self-hosted backend service for ACP-compatible agents'
    description: 'Self-hosted backend service for ACP-compatible agents'
    license: MIT
    publisher_url: 'https://github.com/arafatamim'
    publisher_support_url: 'https://github.com/arafatamim/ferngeist-acp-gateway/issues'
    package_identifier: Ferngeist.Gateway
    repository:
      owner: microsoft
      name: winget-pkgs
